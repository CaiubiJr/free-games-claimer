name: Claim Epic Free Games

on:
  schedule:
    - cron: '0 16 * * 4'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install browser dependencies
        run: npx playwright install firefox --with-deps

      - name: Claim Epic Games
        env:
          EMAIL: ${{ secrets.EPIC_EMAIL }}
          PASSWORD: ${{ secrets.EPIC_PASSWORD }}
        run: node epic-games
